# Builds the downloadable Jamcord app (Python and ffmpeg bundled, nothing to install).
#
# - Run it by hand: GitHub → Actions → "Build app" → "Run workflow".
#   The zip appears under the run's "Artifacts".
# - Push a tag like v1.0.0 to also publish the zip as a GitHub Release.
#
# Only Windows for now. Other systems can be added as more jobs later.
name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to publish releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build Jamcord.exe
        # --paths src: modules import each other by bare name (e.g. "import audio").
        # --collect-all davey: native library for Discord's encrypted voice;
        #   collected explicitly so nothing it loads dynamically is missed.
        run: >
          pyinstaller --noconfirm --clean --name Jamcord
          --paths src --icon assets/avatar.png
          --collect-all davey
          src/bot.py

      # bot.py puts dist/Jamcord/tools on PATH at startup.
      - name: Add ffmpeg and Deno
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/Jamcord/tools | Out-Null

          # ffmpeg streams the audio (LGPL build).
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-download
          $bin = Get-ChildItem ffmpeg-download -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)/ffmpeg.exe", "$($bin.FullName)/ffprobe.exe" dist/Jamcord/tools/

          # Deno lets yt-dlp solve YouTube's JavaScript challenges.
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath dist/Jamcord/tools

      - name: Add guide and zip
        shell: pwsh
        run: |
          Copy-Item "packaging/START HERE.txt" dist/Jamcord/
          Compress-Archive dist/Jamcord Jamcord-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Jamcord-windows
          path: Jamcord-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Jamcord-windows.zip
